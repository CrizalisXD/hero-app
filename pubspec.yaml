name: hero
description: Hero — личная RPG про реальную жизнь.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  collection: ^1.18.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  intl: ^0.20.0
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.2.3
  supabase_flutter: ^2.5.6
  uuid: ^4.4.0

dev_dependencies:
  build_runner: ^2.4.11
  custom_lint: ^0.7.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.4.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/data/
    - assets/images/
    - assets/icons/
    - assets/avatars/
